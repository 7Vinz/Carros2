<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina</title>
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <main class="container">
        <h1>Oficina</h1>

        <section class="item-card" aria-labelledby="item-title">
            <h2 id="item-title">Cadastrar item</h2>
            <form id="form">
                <div class="form-field">
                    <label for="item-name">Nome do item</label>
                    <input id="item-name" name="item-name" type="text" required>
                </div>
                <div class="form-field">
                    <label for="expiry-date">Data de validade</label>
                    <input
                        id="expiry-date"
                        name="expiry-date"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
                        title="Use o formato DD/MM/AAAA."
                        aria-describedby="expiry-hint"
                        required
                    >
                    <small id="expiry-hint">Digite a data no formato DD/MM/AAAA.</small>
                </div>
                <button type="submit">Cadastrar item</button>
            </form>
        </section>

        <section class="item-card">
            <h2>Itens cadastrados</h2>
            <ul id="lista"></ul>
            <button id="usar" type="button">Usar item</button>
        </section>
    </main>

    <script>
        const lista = document.getElementById("lista");

        async function carregar() {
            const itens = await (await fetch("/itens")).json();
            lista.innerHTML = "";
            for (const item of itens) {
                lista.innerHTML += `<li>${item.nome} - ${item.validade}</li>`;
            }
        }

        document.getElementById("form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const resposta = await fetch("/itens", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome: document.getElementById("item-name").value,
                    validade: document.getElementById("expiry-date").value
                })
            });
            if (!resposta.ok) alert("Data inválida");
            else e.target.reset();
            carregar();
        });

        document.getElementById("usar").addEventListener("click", async () => {
            await fetch("/usar", { method: "POST" });
            carregar();
        });

        carregar();
    </script>
</body>
</html>
